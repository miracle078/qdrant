<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Chazon Unified Dashboard | All Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #00ff88;
      overflow: hidden;
    }

    /* Top Navigation */
    #topnav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0,0,0,0.95);
      border-bottom: 2px solid #00ff88;
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      color: #00ccff;
      font-weight: bold;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      flex: 1;
    }

    .tab {
      background: transparent;
      border: 2px solid #333;
      color: #0f0;
      padding: 8px 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
      border-radius: 5px 5px 0 0;
    }

    .tab:hover {
      border-color: #00ff88;
      background: rgba(0,255,136,0.1);
    }

    .tab.active {
      border-color: #00ff88;
      background: rgba(0,255,136,0.2);
      border-bottom-color: transparent;
    }

    .status {
      font-size: 12px;
      color: #888;
    }

    /* Content Area */
    .content {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      display: none;
    }

    .content.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Quick Command Overlay */
    #quickcmd {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.95);
      border: 2px solid #00ff88;
      padding: 30px;
      border-radius: 10px;
      display: none;
      z-index: 2000;
      min-width: 500px;
    }

    #quickcmd.active {
      display: block;
    }

    #quickcmd h2 {
      color: #00ccff;
      margin-bottom: 20px;
    }

    #quickcmd input {
      width: 100%;
      background: #000;
      border: 1px solid #00ff88;
      color: #0f0;
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .shortcuts {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    .shortcuts div {
      padding: 5px 0;
    }

    .key {
      background: #222;
      padding: 2px 8px;
      border-radius: 3px;
      color: #0f0;
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <div id="topnav">
    <div class="logo">🌌 CHAZON</div>
    <div class="nav-tabs">
      <button class="tab active" onclick="switchTab('chazon')">
        Chazon OS
      </button>
      <button class="tab" onclick="switchTab('isaos')">
        ISA-OS Container
      </button>
      <button class="tab" onclick="switchTab('automation')">
        AutomationGPT
      </button>
      <button class="tab" onclick="switchTab('docs')">
        Documentation
      </button>
    </div>
    <div class="status">
      <span id="current-mode">Chazon OS Terminal</span>
    </div>
  </div>

  <!-- Content Panels -->
  <div id="chazon-panel" class="content active">
    <iframe src="chazon.html" title="Chazon OS"></iframe>
  </div>

  <div id="isaos-panel" class="content">
    <iframe src="isa-os.html" title="ISA-OS"></iframe>
  </div>

  <div id="automation-panel" class="content">
    <iframe src="automationgpt.html" title="AutomationGPT"></iframe>
  </div>

  <div id="docs-panel" class="content">
    <iframe src="docs/index.html" title="Documentation"></iframe>
  </div>

  <!-- Quick Command Overlay (Ctrl+K) -->
  <div id="quickcmd">
    <h2>⚡ Quick Command</h2>
    <input
      type="text"
      id="cmd-input"
      placeholder="Type command... (chazon, isa, docs, automation)"
      autofocus>
    <div class="shortcuts">
      <div><span class="key">Ctrl+K</span> - Quick command</div>
      <div><span class="key">Ctrl+1/2/3/4</span> - Switch tabs</div>
      <div><span class="key">Esc</span> - Close overlay</div>
    </div>
  </div>

  <script>
    // Tab Switching
    function switchTab(name) {
      // Hide all panels
      document.querySelectorAll('.content').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      // Show selected panel
      const panelMap = {
        'chazon': 'chazon-panel',
        'isaos': 'isaos-panel',
        'automation': 'automation-panel',
        'docs': 'docs-panel'
      };

      const modeMap = {
        'chazon': 'Chazon OS Terminal',
        'isaos': 'ISA-OS Container Runtime',
        'automation': 'AutomationGPT Search',
        'docs': 'Documentation Hub'
      };

      document.getElementById(panelMap[name]).classList.add('active');
      document.getElementById('current-mode').textContent = modeMap[name];

      // Highlight active tab
      event.target.classList.add('active');
    }

    // Quick Command
    const quickcmd = document.getElementById('quickcmd');
    const cmdInput = document.getElementById('cmd-input');

    document.addEventListener('keydown', (e) => {
      // Ctrl+K - Quick command
      if(e.ctrlKey && e.key === 'k') {
        e.preventDefault();
        quickcmd.classList.toggle('active');
        if(quickcmd.classList.contains('active')) {
          cmdInput.focus();
        }
      }

      // Esc - Close overlay
      if(e.key === 'Escape') {
        quickcmd.classList.remove('active');
      }

      // Ctrl+1/2/3/4 - Tab switching
      if(e.ctrlKey && e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        const tabs = ['chazon', 'isaos', 'automation', 'docs'];
        switchTab(tabs[parseInt(e.key) - 1]);
      }
    });

    cmdInput.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') {
        const cmd = cmdInput.value.toLowerCase().trim();

        // Command routing
        if(cmd.includes('chazon') || cmd === 'os') {
          switchTab('chazon');
        } else if(cmd.includes('isa') || cmd.includes('container')) {
          switchTab('isaos');
        } else if(cmd.includes('auto') || cmd.includes('search')) {
          switchTab('automation');
        } else if(cmd.includes('doc') || cmd.includes('help')) {
          switchTab('docs');
        }

        quickcmd.classList.remove('active');
        cmdInput.value = '';
      }
    });

    // Show welcome message
    console.log('%c🌌 Chazon Unified Dashboard', 'color: #00ff88; font-size: 20px; font-weight: bold;');
    console.log('%cKeyboard Shortcuts:', 'color: #00ccff; font-size: 14px;');
    console.log('  Ctrl+K - Quick command');
    console.log('  Ctrl+1/2/3/4 - Switch tabs');
    console.log('  Esc - Close overlay');
  </script>
</body>
</html>
