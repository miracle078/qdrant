<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Chazon - חזון</title>
    <meta http-equiv="refresh" content="0; url=chazon/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: #00ff88;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff88;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88; }
            to { text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, 0 0 60px #00ff88; }
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,255,136,0.3);
            border-radius: 50%;
            border-top-color: #00ff88;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            margin-top: 20px;
            opacity: 0.7;
        }

        a {
            color: #00ccff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loading">
        <h1>🌌 Chazon OS</h1>
        <div class="spinner"></div>
        <p>Booting φ-Balanced Computing Platform...</p>
        <p style="font-size: 0.9em; margin-top: 40px;">
            If not redirected, <a href="chazon/">click here</a>
        </p>
    </div>

    <script>
        // Immediate redirect (meta refresh is backup)
        window.location.href = 'chazon/';
    </script>
</body>
</html>
