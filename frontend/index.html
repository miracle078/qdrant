<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Chazon - AI Medical Imaging</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
    color: #00ff88;
    overflow: hidden;
  }
  #boot-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s;
  }
  #boot-screen.hidden { opacity: 0; pointer-events: none; }
  #boot-log {
    width: 80%;
    max-width: 600px;
    text-align: left;
    line-height: 1.6;
  }
  .boot-line {
    animation: fadeIn 0.3s;
    margin: 2px 0;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #terminal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 1200px;
    height: 80%;
    background: #000;
    border: 3px solid #00ff88;
    border-radius: 8px;
    padding: 20px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }
  #terminal.active { display: flex; }
  #output {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 10px;
    white-space: pre-wrap;
    font-size: 14px;
  }
  #input-line {
    display: flex;
    align-items: center;
  }
  #prompt { color: #00ff88; margin-right: 5px; }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    color: #00ff88;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .taskbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 40px;
    background: #0a0a0a;
    border-top: 2px solid #00ff88;
    display: none;
    align-items: center;
    padding: 0 15px;
    font-size: 12px;
  }
  .taskbar.active { display: flex; }
  .button {
    background: #00ff88;
    color: #000;
    border: none;
    padding: 5px 15px;
    margin: 0 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
  }
  .button:hover { background: #00cc66; }
</style>
</head>
<body>

<!-- Boot Screen -->
<div id="boot-screen">
  <div id="boot-log"></div>
</div>

<!-- Terminal -->
<div id="terminal">
  <div id="output"></div>
  <div id="input-line">
    <span id="prompt">chazon@os:~$</span>
    <input type="text" id="input" autofocus>
  </div>
</div>

<!-- Taskbar -->
<div class="taskbar">
  <span>🌌 Chazon | חזון | AI Medical Imaging</span>
  <span style="flex:1"></span>
  <button class="button" onclick="runDemo()">Demo</button>
  <button class="button" onclick="showHelp()">Help</button>
  <button class="button" onclick="clearTerminal()">Clear</button>
</div>

<script>
// Minimal MDCompiler Bootstrap
window.MDCompiler = {
  compile(markdown) {
    const regex = /```(?:javascript|js)?\n([\s\S]*?)```/g;
    const blocks = [];
    let match;
    while ((match = regex.exec(markdown))) {
      blocks.push(match[1].trim());
    }
    return blocks.map(code => {
      try {
        return { success: true, output: eval(code) };
      } catch (err) {
        return { success: false, error: err.message };
      }
    });
  }
};

// Load and initialize boot sequencer
async function initBoot() {
  const response = await fetch('../boot/boot-sequencer.md');
  const markdown = await response.text();
  const compiled = MDCompiler.compile(markdown);

  // Start boot sequence
  if (window.BootSequencer) {
    await BootSequencer.boot();
  }
}

// Terminal Handler
const Terminal = {
  output: document.getElementById('output'),
  input: document.getElementById('input'),

  print(text, color = '#00ff88') {
    const line = document.createElement('div');
    line.style.color = color;
    line.textContent = text;
    this.output.appendChild(line);
    this.output.scrollTop = this.output.scrollHeight;
  },

  async exec(command) {
    this.print(`chazon@os:~$ ${command}`, '#00ff88');
    if (!command.trim()) return;

    if (command === 'demo') {
      runDemo();
      return;
    }

    if (window.ChazonCLI) {
      try {
        await ChazonCLI.exec(command);
      } catch (err) {
        this.print(`Error: ${err.message}`, '#ff0044');
      }
    } else {
      this.print('Error: CLI not loaded', '#ff0044');
    }
  }
};

// Event Handlers
document.getElementById('input').addEventListener('keypress', async (e) => {
  if (e.key === 'Enter') {
    const input = e.target;
    const command = input.value;
    input.value = '';
    input.disabled = true;
    await Terminal.exec(command);
    input.disabled = false;
    input.focus();
  }
});

function showHelp() {
  Terminal.exec('help');
}

function clearTerminal() {
  Terminal.exec('clear');
}

function runDemo() {
  Terminal.print('\n🎬 Running demo programs...\n');
  const demos = ['hello.md', 'calculator.md', 'neural.md'];
  demos.forEach((demo, i) => {
    setTimeout(() => {
      Terminal.print(`\n--- ${demo} ---`);
      Terminal.exec(`run ${demo}`);
    }, i * 1000);
  });
}

// Boot on load
window.addEventListener('load', () => {
  initBoot();
});
</script>

</body>
</html>
