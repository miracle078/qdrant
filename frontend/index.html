<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Chazon OS - חזון</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
    color: #00ff88;
    overflow: hidden;
  }
  #boot-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s;
  }
  #boot-screen.hidden { opacity: 0; pointer-events: none; }
  #boot-log {
    width: 80%;
    max-width: 600px;
    text-align: left;
    line-height: 1.6;
  }
  .boot-line {
    animation: fadeIn 0.3s;
    margin: 2px 0;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #terminal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 1200px;
    height: 80%;
    background: #000;
    border: 3px solid #00ff88;
    border-radius: 8px;
    padding: 20px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }
  #terminal.active { display: flex; }
  #output {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 10px;
    white-space: pre-wrap;
    font-size: 14px;
  }
  #input-line {
    display: flex;
    align-items: center;
  }
  #prompt { color: #00ff88; margin-right: 5px; }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    color: #00ff88;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .taskbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 40px;
    background: #0a0a0a;
    border-top: 2px solid #00ff88;
    display: none;
    align-items: center;
    padding: 0 15px;
    font-size: 12px;
  }
  .taskbar.active { display: flex; }
  .button {
    background: #00ff88;
    color: #000;
    border: none;
    padding: 5px 15px;
    margin: 0 5px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    border-radius: 3px;
  }
  .button:hover { background: #00cc66; }
</style>
</head>
<body>

<!-- Boot Screen -->
<div id="boot-screen">
  <div id="boot-log"></div>
</div>

<!-- Terminal -->
<div id="terminal">
  <div id="output"></div>
  <div id="input-line">
    <span id="prompt">chazon@os:~$</span>
    <input type="text" id="input" autofocus>
  </div>
</div>

<!-- Taskbar -->
<div class="taskbar">
  <span>🌌 Chazon OS | חזון | φ=1.618</span>
  <span style="flex:1"></span>
  <button class="button" onclick="runDemo()">Demo</button>
  <button class="button" onclick="showHelp()">Help</button>
  <button class="button" onclick="clearTerminal()">Clear</button>
</div>

<script>
// Bootstrap Loader
const ChazonBootstrap = {
  modules: [
    // Core infrastructure (load first)
    '../modules/chazon-attractors.md',
    '../modules/chazon-equilibrium.md',
    '../modules/chazon-packml.md',
    '../modules/chazon-changelog.md',
    '../modules/chazon-sqlite.md',
    '../modules/chazon-mdcompiler.md',
    '../modules/chazon-os.md',
    // CLI modules (load before chazon-cli)
    '../modules/cli-core.md',
    '../modules/cli-edit.md',
    '../modules/cli-test.md',
    '../modules/cli-logs.md',
    '../modules/cli-git.md',
    '../modules/chazon-cli.md',
    '../modules/chazon-state.md',
    '../modules/chazon-mcp.md',
    '../modules/chazon-api.md',
    '../modules/chazon-wrapper.md',
    '../modules/chazon-sync.md',
    '../modules/chazon-integration.md',
    // Agents
    '../modules/agent-ci.md',
    '../modules/agent-test.md',
    '../modules/agent-deploy.md',
    // UI
    '../modules/ui-desktop.md',
    '../modules/ui-windows.md',
    '../modules/ui-icons.md',
    '../modules/ui-taskbar.md',
    '../modules/ui-theme.md',
    '../modules/ui-index.md',
    // Standards
    '../modules/isa-standards.md',
    '../modules/isa-compliance.md',
    // Medical/Qdrant
    '../modules/qdrant-medical.md',
    '../modules/qdrant-client.md',
    '../modules/embed-openai.md',
    '../modules/xray-analyzer.md',
    '../modules/medical-dataset.md',
    '../modules/dicom-viewer.md'
  ],

  programs: [
    '../modules/program-hello.md',
    '../modules/program-calculator.md',
    '../modules/program-data.md',
    '../modules/program-search.md',
    '../modules/program-events.md',
    '../modules/program-neural.md',
    '../modules/program-cicd.md',
    '../modules/program-test-sync.md',
    '../modules/program-attractor-demo.md',
    '../modules/program-qdrant-real-demo.md',
    '../modules/program-isa-os-demo.md',
    '../modules/program-medical-demo.md',
    '../modules/program-xray-3d.md'
  ],

  async boot() {
    this.log('🌌 Chazon OS v1.0.0');
    this.log('חזון - Vision | φ-Balanced Computing');
    this.log('');

    this.log('Loading markdown compiler...');
    await this.loadCompiler();

    this.log('Loading core modules...');
    await this.loadModules();

    this.log('Loading programs...');
    await this.loadPrograms();

    this.log('Initializing OS...');
    if (window.ChazonOS) ChazonOS.boot();

    this.log('');
    this.log('✅ Boot complete!');
    this.log('Type "help" for commands');

    setTimeout(() => this.showTerminal(), 2000);
  },

  async loadCompiler() {
    // Bootstrap minimal compiler
    window.MDCompiler = {
      compile(markdown) {
        const regex = /```(?:javascript|js)?\n([\s\S]*?)```/g;
        const blocks = [];
        let match;
        while ((match = regex.exec(markdown))) {
          blocks.push(match[1].trim());
        }
        return blocks.map(code => {
          try {
            return { success: true, output: eval(code) };
          } catch (err) {
            return { success: false, error: err.message };
          }
        });
      }
    };
  },

  async loadModules() {
    for (const module of this.modules) {
      try {
        const response = await fetch(module);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const markdown = await response.text();
        const compiled = MDCompiler.compile(markdown);

        // Check compilation results
        let hasError = false;
        compiled.forEach(result => {
          if (!result.success) {
            this.log(`    Error in ${module.split('/').pop()}: ${result.error}`);
            hasError = true;
          }
        });

        if (!hasError) {
          this.log(`  ✓ ${module.split('/').pop()}`);
        }
      } catch (err) {
        this.log(`  ✗ ${module.split('/').pop()}: ${err.message}`);
        console.error(`Failed to load ${module}:`, err);
      }
    }
  },

  async loadPrograms() {
    if (!window.ChazonCLI) {
      this.log('  ⚠️ CLI not available, skipping programs');
      return;
    }

    for (const program of this.programs) {
      try {
        const response = await fetch(program);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const content = await response.text();
        const name = program.split('/').pop();
        ChazonCLI.addFile(name, content);
        this.log(`  ✓ ${name}`);
      } catch (err) {
        this.log(`  ✗ ${program.split('/').pop()}: ${err.message}`);
        console.error(`Failed to load program ${program}:`, err);
      }
    }
  },

  log(message) {
    const bootLog = document.getElementById('boot-log');
    const line = document.createElement('div');
    line.className = 'boot-line';
    line.textContent = message;
    bootLog.appendChild(line);
  },

  showTerminal() {
    document.getElementById('boot-screen').classList.add('hidden');
    document.getElementById('terminal').classList.add('active');
    document.querySelector('.taskbar').classList.add('active');

    // Initialize CLI with output element
    if (window.ChazonCLI) {
      const output = document.getElementById('output');
      ChazonCLI.init(output);
    }

    // Print welcome message to terminal
    Terminal.print('═══════════════════════════════════════════════════════════', '#00ff88');
    Terminal.print('         🌌 CHAZON OS - חזון (Vision)         ', '#00ccff');
    Terminal.print('═══════════════════════════════════════════════════════════', '#00ff88');
    Terminal.print('');
    Terminal.print('φ-Balanced Computing | ISA-95 Compliant | Markdown Programs', '#888');
    Terminal.print('');
    Terminal.print('CLI Command Modules Loaded:', '#00ff88');
    if (window.ChazonCLI && ChazonCLI.commandModules) {
      ChazonCLI.commandModules.forEach(mod => {
        Terminal.print(`  ✓ ${mod}`, '#888');
      });
    }
    Terminal.print('');
    Terminal.print('Type "help" for all commands', '#00ccff');
    Terminal.print('');
    Terminal.print('Quick Start:', '#00ccff');
    Terminal.print('  help          - Show all commands', '#888');
    Terminal.print('  ls            - List programs', '#888');
    Terminal.print('  run hello.md  - Run hello program', '#888');
    Terminal.print('  test          - Run tests', '#888');
    Terminal.print('  logs          - View system logs', '#888');
    Terminal.print('');
    Terminal.print('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', '#00ff88');
    Terminal.print('');

    document.getElementById('input').focus();
  }
};

// Terminal Handler
const Terminal = {
  output: document.getElementById('output'),
  input: document.getElementById('input'),
  loading: false,

  print(text, color = '#00ff88') {
    const line = document.createElement('div');
    line.style.color = color;
    line.textContent = text;
    this.output.appendChild(line);
    this.output.scrollTop = this.output.scrollHeight;
  },

  spinner() {
    const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    let i = 0;
    const line = document.createElement('div');
    line.style.color = '#00ff88';
    this.output.appendChild(line);
    return setInterval(() => {
      line.textContent = `${frames[i++ % frames.length]} Loading...`;
    }, 80);
  },

  stopSpinner(id) {
    clearInterval(id);
    this.output.removeChild(this.output.lastChild);
  },

  async exec(command) {
    this.print(`chazon@os:~$ ${command}`, '#00ff88');

    if (!command.trim()) return;

    // Special demo command
    if (command === 'demo') {
      runDemo();
      return;
    }

    // Execute via ChazonCLI
    if (window.ChazonCLI) {
      const spinner = command.startsWith('run') ? this.spinner() : null;
      try {
        await ChazonCLI.exec(command);
        if (spinner) this.stopSpinner(spinner);
      } catch (err) {
        if (spinner) this.stopSpinner(spinner);
        this.print(`Error: ${err.message}`, '#ff0044');
      }
    } else {
      this.print('Error: CLI not loaded', '#ff0044');
    }
  }
};

// Event Handlers
document.getElementById('input').addEventListener('keypress', async (e) => {
  if (e.key === 'Enter') {
    const input = e.target;
    const command = input.value;
    input.value = '';
    input.disabled = true;
    await Terminal.exec(command);
    input.disabled = false;
    input.focus();
  }
});

function showHelp() {
  Terminal.exec('help');
}

function clearTerminal() {
  Terminal.exec('clear');
}

function runDemo() {
  Terminal.print('\n🎬 Running demo programs...\n');
  const demos = ['hello.md', 'calculator.md', 'neural.md'];

  demos.forEach((demo, i) => {
    setTimeout(() => {
      Terminal.print(`\n--- ${demo} ---`);
      Terminal.exec(`run ${demo}`);
    }, i * 1000);
  });
}

// Boot on load
window.addEventListener('load', () => {
  ChazonBootstrap.boot();
});
</script>

</body>
</html>
