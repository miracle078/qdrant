<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Chazon - AI Medical Imaging</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #0a0a0a;
    color: #00ff88;
    overflow: hidden;
    height: 100vh;
  }

  /* Main Layout */
  #app {
    display: grid;
    grid-template-rows: 50px 1fr 40px;
    height: 100vh;
  }

  /* Header */
  #header {
    background: #1a1a2e;
    border-bottom: 2px solid #00ff88;
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
  }

  #header h1 {
    font-size: 1.2em;
    color: #00ff88;
  }

  #nav-tabs {
    display: flex;
    gap: 10px;
  }

  .tab {
    padding: 8px 16px;
    background: #0a0a0a;
    border: 1px solid #00ff88;
    color: #00ff88;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .tab:hover {
    background: #00ff88;
    color: #000;
  }

  .tab.active {
    background: #00ff88;
    color: #000;
  }

  /* Main Content Area */
  #content {
    display: grid;
    grid-template-columns: 1fr 400px;
    overflow: hidden;
  }

  /* Screens */
  .screen {
    display: none;
    padding: 20px;
    overflow-y: auto;
  }

  .screen.active {
    display: block;
  }

  /* Log Panel (Always Visible) */
  #log-panel {
    background: #000;
    border-left: 2px solid #00ff88;
    padding: 20px;
    overflow-y: auto;
    font-size: 12px;
  }

  #log-panel h3 {
    color: #00ccff;
    margin-bottom: 10px;
    position: sticky;
    top: 0;
    background: #000;
    padding: 5px 0;
  }

  .log-entry {
    margin: 2px 0;
    padding: 2px 0;
    animation: fadeIn 0.3s;
  }

  .log-entry.success { color: #00ff88; }
  .log-entry.error { color: #ff0044; }
  .log-entry.warning { color: #ffaa00; }
  .log-entry.info { color: #00ccff; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Terminal Screen */
  #terminal-screen {
    background: #000;
    display: flex;
    flex-direction: column;
  }

  #terminal-output {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    white-space: pre-wrap;
    font-size: 14px;
  }

  #terminal-input-line {
    display: flex;
    align-items: center;
    padding: 10px;
    border-top: 1px solid #00ff88;
  }

  #terminal-prompt {
    color: #00ff88;
    margin-right: 5px;
  }

  #terminal-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #00ff88;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }

  /* Debug Screen */
  #debug-screen {
    background: #0a0a0a;
  }

  .module-status {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 10px;
    margin: 10px 0;
  }

  .module-status.loaded {
    border-color: #00ff88;
  }

  .module-status.error {
    border-color: #ff0044;
  }

  .module-name {
    font-weight: bold;
    color: #00ccff;
  }

  .module-path {
    color: #888;
    font-size: 11px;
  }

  .module-error {
    color: #ff0044;
    font-size: 12px;
    margin-top: 5px;
  }

  /* Status Bar */
  #status-bar {
    background: #1a1a2e;
    border-top: 2px solid #00ff88;
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
    font-size: 12px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #888;
  }

  .status-indicator.loading {
    background: #ffaa00;
    animation: pulse 1s infinite;
  }

  .status-indicator.ready {
    background: #00ff88;
  }

  .status-indicator.error {
    background: #ff0044;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Buttons */
  .btn {
    padding: 5px 15px;
    background: #00ff88;
    color: #000;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }

  .btn:hover {
    background: #00cc66;
  }

  .btn.secondary {
    background: #333;
    color: #00ff88;
  }

  /* Boot Progress */
  #boot-progress {
    margin: 20px 0;
  }

  .phase {
    margin: 10px 0;
    padding: 10px;
    background: #1a1a2e;
    border-left: 3px solid #333;
  }

  .phase.loading {
    border-left-color: #ffaa00;
  }

  .phase.complete {
    border-left-color: #00ff88;
  }

  .phase.error {
    border-left-color: #ff0044;
  }

  .phase-name {
    color: #00ccff;
    font-weight: bold;
  }

  .phase-status {
    color: #888;
    font-size: 11px;
  }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div id="header">
    <h1>🌌 Chazon - AI Medical Imaging</h1>
    <div id="nav-tabs">
      <button class="tab active" onclick="switchScreen('boot')">Boot</button>
      <button class="tab" onclick="switchScreen('terminal')">Terminal</button>
      <button class="tab" onclick="switchScreen('debug')">Debug</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="content">
    <!-- Screens -->
    <div id="screens">
      <!-- Boot Screen -->
      <div id="boot-screen" class="screen active">
        <h2>System Boot</h2>
        <div id="boot-progress"></div>
        <div style="margin-top: 20px;">
          <button class="btn" onclick="startBoot()">Start Boot</button>
          <button class="btn secondary" onclick="testPhase(0)">Test Phase 0</button>
          <button class="btn secondary" onclick="clearLogs()">Clear Logs</button>
        </div>
      </div>

      <!-- Terminal Screen -->
      <div id="terminal-screen" class="screen">
        <div id="terminal-output"></div>
        <div id="terminal-input-line">
          <span id="terminal-prompt">chazon@os:~$</span>
          <input type="text" id="terminal-input" autofocus>
        </div>
      </div>

      <!-- Debug Screen -->
      <div id="debug-screen" class="screen">
        <h2>Module Debug Info</h2>
        <div id="module-list"></div>
      </div>
    </div>

    <!-- Log Panel (Always Visible) -->
    <div id="log-panel">
      <h3>System Log</h3>
      <div id="log-content"></div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar">
    <div class="status-item">
      <div class="status-indicator" id="status-indicator"></div>
      <span id="status-text">Idle</span>
    </div>
    <div class="status-item">
      <span id="module-count">Modules: 0/0</span>
      <span id="phase-count">Phase: 0/6</span>
    </div>
  </div>
</div>

<script>
// Global state
const ChazonApp = {
  currentScreen: 'boot',
  bootState: 'idle',
  modules: [],
  phases: [],
  errors: []
};

// Logging
const Logger = {
  log(message, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
    document.getElementById('log-content').appendChild(entry);

    // Auto-scroll
    const logPanel = document.getElementById('log-panel');
    logPanel.scrollTop = logPanel.scrollHeight;
  },

  success(msg) { this.log(msg, 'success'); },
  error(msg) { this.log(msg, 'error'); ChazonApp.errors.push(msg); },
  warning(msg) { this.log(msg, 'warning'); },
  info(msg) { this.log(msg, 'info'); }
};

// Screen switching
function switchScreen(screenName) {
  // Update tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  event.target.classList.add('active');

  // Update screens
  document.querySelectorAll('.screen').forEach(screen => {
    screen.classList.remove('active');
  });
  document.getElementById(`${screenName}-screen`).classList.add('active');

  ChazonApp.currentScreen = screenName;
  Logger.info(`Switched to ${screenName} screen`);
}

// Clear logs
function clearLogs() {
  document.getElementById('log-content').innerHTML = '';
  Logger.info('Logs cleared');
}

// Update status
function updateStatus(text, state = 'idle') {
  document.getElementById('status-text').textContent = text;
  const indicator = document.getElementById('status-indicator');
  indicator.className = `status-indicator ${state}`;
  ChazonApp.bootState = state;
}

// Minimal MDCompiler
window.MDCompiler = {
  compile(markdown) {
    const regex = /```(?:javascript|js)?\n([\s\S]*?)```/g;
    const blocks = [];
    let match;
    while ((match = regex.exec(markdown))) {
      blocks.push(match[1].trim());
    }
    return blocks.map(code => {
      try {
        eval(code);
        return { success: true };
      } catch (err) {
        return { success: false, error: err.message };
      }
    });
  }
};

// Load single module
async function loadModule(path) {
  try {
    Logger.info(`Loading: ${path}`);
    const response = await fetch(path);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const markdown = await response.text();
    const compiled = MDCompiler.compile(markdown);

    let hasError = false;
    compiled.forEach(result => {
      if (!result.success) {
        Logger.error(`Error in ${path}: ${result.error}`);
        hasError = true;
      }
    });

    if (!hasError) {
      Logger.success(`✓ ${path.split('/').pop()}`);
      ChazonApp.modules.push({ path, status: 'loaded' });
      return true;
    } else {
      ChazonApp.modules.push({ path, status: 'error' });
      return false;
    }
  } catch (err) {
    Logger.error(`✗ ${path}: ${err.message}`);
    ChazonApp.modules.push({ path, status: 'error', error: err.message });
    return false;
  }
}

// Test single phase
async function testPhase(phaseNum) {
  Logger.info(`Testing Phase ${phaseNum}...`);
  updateStatus(`Testing Phase ${phaseNum}`, 'loading');

  const phases = [
    {
      name: 'Phase 0: Core',
      modules: [
        '../modules/chazon-mdcompiler.md',
        '../modules/chazon-os.md',
        '../modules/chazon-attractors.md'
      ]
    },
    {
      name: 'Phase 1: CLI',
      modules: [
        '../modules/cli-core.md',
        '../modules/chazon-cli.md'
      ]
    }
  ];

  const phase = phases[phaseNum];
  if (!phase) {
    Logger.error(`Phase ${phaseNum} not found`);
    return;
  }

  updateBootPhase(phase.name, 'loading');

  for (const modulePath of phase.modules) {
    await loadModule(modulePath);
  }

  updateBootPhase(phase.name, 'complete');
  updateStatus('Test complete', 'ready');
  Logger.success(`Phase ${phaseNum} test complete`);
}

// Update boot progress UI
function updateBootPhase(phaseName, status) {
  let phaseEl = document.querySelector(`[data-phase="${phaseName}"]`);

  if (!phaseEl) {
    phaseEl = document.createElement('div');
    phaseEl.className = 'phase';
    phaseEl.dataset.phase = phaseName;
    phaseEl.innerHTML = `
      <div class="phase-name">${phaseName}</div>
      <div class="phase-status">Idle</div>
    `;
    document.getElementById('boot-progress').appendChild(phaseEl);
  }

  phaseEl.className = `phase ${status}`;
  phaseEl.querySelector('.phase-status').textContent = status.toUpperCase();
}

// Full boot sequence
async function startBoot() {
  Logger.info('Starting boot sequence...');
  updateStatus('Booting', 'loading');
  ChazonApp.modules = [];

  // Load boot sequencer first
  Logger.info('Loading boot sequencer...');

  try {
    await loadModule('../boot/boot-sequencer.md');

    if (window.BootSequencer) {
      Logger.success('Boot sequencer loaded');
      await window.BootSequencer.boot();
    } else {
      Logger.error('Boot sequencer not found in window');
      updateStatus('Boot failed', 'error');
    }
  } catch (err) {
    Logger.error(`Boot failed: ${err.message}`);
    updateStatus('Boot failed', 'error');
  }
}

// Terminal
const Terminal = {
  print(text, color = '#00ff88') {
    const line = document.createElement('div');
    line.style.color = color;
    line.textContent = text;
    document.getElementById('terminal-output').appendChild(line);

    const output = document.getElementById('terminal-output');
    output.scrollTop = output.scrollHeight;
  },

  async exec(command) {
    this.print(`chazon@os:~$ ${command}`, '#00ff88');

    if (!command.trim()) return;

    if (command === 'help') {
      this.print('\nAvailable commands:', '#00ccff');
      this.print('  help     - Show this help', '#888');
      this.print('  clear    - Clear terminal', '#888');
      this.print('  ls       - List files', '#888');
      this.print('  boot     - Run boot sequence', '#888');
      this.print('');
      return;
    }

    if (command === 'clear') {
      document.getElementById('terminal-output').innerHTML = '';
      return;
    }

    if (command === 'boot') {
      startBoot();
      return;
    }

    if (window.ChazonCLI) {
      try {
        await ChazonCLI.exec(command);
      } catch (err) {
        this.print(`Error: ${err.message}`, '#ff0044');
      }
    } else {
      this.print('CLI not loaded yet. Run boot first.', '#ff0044');
    }
  }
};

// Terminal input
document.getElementById('terminal-input').addEventListener('keypress', async (e) => {
  if (e.key === 'Enter') {
    const input = e.target;
    const command = input.value;
    input.value = '';
    await Terminal.exec(command);
  }
});

// Initialize
window.addEventListener('load', () => {
  Logger.info('Chazon v1.0.0 - AI Medical Imaging Analyzer');
  Logger.info('lablab.ai Qdrant Challenge');
  Logger.info('');
  Logger.info('Ready. Click "Start Boot" to begin.');
  updateStatus('Ready', 'ready');
});
</script>

</body>
</html>
