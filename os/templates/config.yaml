area:
  id: templates
  name: Template System
  icon: 📄
  description: ISA template engine and P&ID generator

plc:
  tag: PLC-009
  scan_time_ms: 90
  status: READY
  tag_count: 67
  routine_count: 8

operations:
  - name: Load Template
    action: loadTemplate
  - name: Render Template
    action: renderTemplate
  - name: Generate P&ID
    action: generatePID
  - name: Export CAD
    action: exportCAD

metrics:
