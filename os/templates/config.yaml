    tag: TEMPLATE_COUNT
  - label: Render Time
    tag: TEMPLATE_RENDER_TIME
    unit: ms
  - label: P&IDs Generated
    tag: TEMPLATE_PID_COUNT

mqtt:
  topics:
    - chazon/os/templates/render/complete
    - chazon/os/templates/pid/generated
